<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="管理簿">
<link rel="manifest" href="manifest.json">
<title>管理簿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:white;padding:18px 16px calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
h1{margin:0;font-size:24px}.tabs{display:flex;gap:8px;padding:10px;background:white;position:sticky;top:68px;z-index:4;overflow:auto}.tab{border:0;background:#eef2ff;padding:10px 14px;border-radius:20px;font-weight:700;white-space:nowrap}.tab.active{background:#2563eb;color:#fff}
main{padding:14px;max-width:720px;margin:auto}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white}
button.primary{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:#2563eb;color:white;font-size:17px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat small{color:#64748b}.stat b{display:block;font-size:19px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}
.rowbtn{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:6px 8px}.muted{color:#64748b;font-size:13px}.empty{text-align:center;padding:30px;color:#64748b}
.hidden{display:none}.yearbar{display:flex;gap:8px;align-items:center}.yearbar button{border:0;border-radius:10px;padding:8px 12px;background:#e5e7eb;font-weight:700}
@media print{
      body{background:#fff}
      header,.tabs,#input,#records,#prevYear,#nextYear,#printSummary{display:none!important}
      #summary{display:block!important}
      main{max-width:none;padding:0}
      .card{box-shadow:none;border:0}
      #sumYear{font-size:22px}
      table{font-size:12px}
      .stat{border:1px solid #ddd}
    }
</style>
</head>
<body>
<header><h1>📒 管理簿</h1></header>
<div class="tabs">
<button class="tab active" data-tab="input">入力</button>
<button class="tab" data-tab="summary">月別集計</button>
<button class="tab" data-tab="records">履歴</button>
</div>
<main>
<section id="input">
<div class="card">
<h2>商品を登録</h2>
<label>日付</label><input id="date" type="date">
<label>店名</label><input id="store" placeholder="店名を入力">
<label>区分</label>
<select id="category">
<option value="品物">品物</option>
<option value="梱包資材">梱包資材</option>
<option value="会合">会合</option>
<option value="食事">食事</option>
<option value="設備">設備</option>
<option value="その他">その他</option>
</select>
<label>商品名</label><input id="name" placeholder="商品名を入力">
<label>数量</label><input id="qty" type="number" min="0" step="1" value="1">
<label>原価（1個）</label><input id="cost" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
<label>売値（1個）</label><input id="price" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
<div class="grid" style="margin-top:14px">
<div class="stat"><small>売上金額</small><b id="previewSales">¥0</b></div>
<div class="stat"><small>利益</small><b id="previewProfit">¥0</b></div>
</div>
<button class="primary" id="save">登録する</button>
<p class="muted">登録すると日付の年に自動保存されます。</p>
</div>
</section>

<section id="summary" class="hidden">
<div class="card">
<div class="yearbar"><button id="prevYear">‹</button><h2 id="sumYear" style="margin:0;flex:1;text-align:center"></h2><button id="nextYear">›</button></div>
<button class="primary" id="printSummary" style="margin-top:12px">🖨️ この年の集計表を印刷</button><div class="grid" style="margin-top:12px">
<div class="stat"><small>年間売上</small><b id="yearSales">¥0</b></div>
<div class="stat"><small>年間利益</small><b id="yearProfit">¥0</b></div>
</div>
</div>
<div class="card"><table><thead><tr><th>月</th><th>売上</th><th>原価</th><th>利益</th><th>数量</th></tr></thead><tbody id="monthly"></tbody></table>
<p class="muted">月をタップすると、その月の明細を表示します。</p></div>
<div class="card hidden" id="monthDetailCard">
  <div class="yearbar"><button id="closeDetail">×</button><h2 id="detailTitle" style="margin:0;flex:1;text-align:center"></h2></div>
  <div class="grid" style="margin-top:12px">
    <div class="stat"><small>売上</small><b id="detailSales">¥0</b></div>
    <div class="stat"><small>原価</small><b id="detailCost">¥0</b></div>
    <div class="stat"><small>利益</small><b id="detailProfit">¥0</b></div>
    <div class="stat"><small>数量</small><b id="detailQty">0</b></div>
  </div>
  <h3>区分別集計</h3>
  <div id="categoryDetail"></div>
  <h3>明細</h3>
  <div id="monthRecords"></div>
</div>
</section>

<section id="records" class="hidden">
<div class="card">
<div class="yearbar"><button id="prevRec">‹</button><h2 id="recYear" style="margin:0;flex:1;text-align:center"></h2><button id="nextRec">›</button></div>
</div>
<div class="card"><div id="recordList"></div></div>
</section>
</main>
<script>
const KEY="kanribo_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentYear=new Date().getFullYear(), sumYear=currentYear, recYear=currentYear;
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function yen(n){return "¥"+Math.round(n||0).toLocaleString("ja-JP")}
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function updatePreview(){let q=+$("qty").value||0,c=+$("cost").value||0,p=+$("price").value||0;$("previewSales").textContent=yen(q*p);$("previewProfit").textContent=yen(q*(p-c))}
["qty","cost","price"].forEach(id=>$(id).addEventListener("input",updatePreview));
$("save").onclick=()=>{
 const date=$("date").value,store=$("store").value.trim(),category=$("category").value,name=$("name").value.trim(),qty=+$("qty").value||0,cost=+$("cost").value||0,price=+$("price").value||0;
 if(!date||!store||!name||qty<=0){alert("日付・店名・区分・商品名・数量を入力してください。");return}
 data.push({id:Date.now(),date,store,category,name,qty,cost,price});
 saveData(); alert("登録しました！");
 $("store").value=""; $("category").value="品物"; $("name").value=""; $("qty").value=1; $("cost").value=""; $("price").value=""; updatePreview(); render();
};
function renderSummary(){
 $("sumYear").textContent=sumYear+"年";let rows="",ys=0,yp=0;
 for(let m=1;m<=12;m++){
   let a=data.filter(x=>new Date(x.date).getFullYear()===sumYear&&new Date(x.date).getMonth()+1===m),
   s=a.reduce((v,x)=>v+x.qty*x.price,0),c=a.reduce((v,x)=>v+x.qty*x.cost,0),p=s-c,q=a.reduce((v,x)=>v+x.qty,0);
   ys+=s;yp+=p;
   rows+=`<tr onclick="showMonthDetail(${m})" style="cursor:pointer"><td><b>${m}月</b></td><td>${yen(s)}</td><td>${yen(c)}</td><td>${yen(p)}</td><td>${q}</td></tr>`;
 }
 $("yearSales").textContent=yen(ys);$("yearProfit").textContent=yen(yp);$("monthly").innerHTML=rows;
}
function showMonthDetail(month){
 const a=data.filter(x=>{let d=new Date(x.date);return d.getFullYear()===sumYear&&d.getMonth()+1===month}).sort((a,b)=>a.date.localeCompare(b.date));
 const sales=a.reduce((v,x)=>v+x.qty*x.price,0),cost=a.reduce((v,x)=>v+x.qty*x.cost,0),profit=sales-cost,qty=a.reduce((v,x)=>v+x.qty,0);
 $("detailTitle").textContent=`${sumYear}年${month}月 詳細`;
 $("detailSales").textContent=yen(sales);$("detailCost").textContent=yen(cost);$("detailProfit").textContent=yen(profit);$("detailQty").textContent=qty;
 const cats=["品物","梱包資材","会合","食事","設備","その他"];
 $("categoryDetail").innerHTML='<table><thead><tr><th>区分</th><th>売上</th><th>原価</th><th>利益</th><th>数量</th></tr></thead><tbody>'+
 cats.map(cat=>{let z=a.filter(x=>(x.category||"その他")===cat),s=z.reduce((v,x)=>v+x.qty*x.price,0),c=z.reduce((v,x)=>v+x.qty*x.cost,0),q=z.reduce((v,x)=>v+x.qty,0);return `<tr><td>${cat}</td><td>${yen(s)}</td><td>${yen(c)}</td><td>${yen(s-c)}</td><td>${q}</td></tr>`}).join("")+
 '</tbody></table>';
 $("monthRecords").innerHTML=a.length?'<table><thead><tr><th>日付</th><th>店名</th><th>区分</th><th>商品</th><th>数量</th><th>原価</th><th>売値</th><th>売上</th><th>利益</th></tr></thead><tbody>'+
 a.map(x=>`<tr><td>${x.date}</td><td>${x.store||""}</td><td>${x.category||"その他"}</td><td>${x.name}</td><td>${x.qty}</td><td>${yen(x.cost)}</td><td>${yen(x.price)}</td><td>${yen(x.qty*x.price)}</td><td>${yen(x.qty*(x.price-x.cost))}</td></tr>`).join("")+
 '</tbody></table>':'<div class="empty">この月の明細はありません。</div>';
 $("monthDetailCard").classList.remove("hidden");
 $("monthDetailCard").scrollIntoView({behavior:"smooth"});
}
function renderRecords(){
 $("recYear").textContent=recYear+"年";let a=data.filter(x=>new Date(x.date).getFullYear()===recYear).sort((a,b)=>b.date.localeCompare(a.date));
 if(!a.length){$("recordList").innerHTML='<div class="empty">この年のデータはありません。</div>';return}
 $("recordList").innerHTML='<table><thead><tr><th>日付</th><th>店名</th><th>区分</th><th>商品</th><th>数量</th><th>売上</th><th>利益</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${x.date}</td><td>${x.store||""}</td><td>${x.category||"その他"}</td><td>${x.name}</td><td>${x.qty}</td><td>${yen(x.qty*x.price)}</td><td>${yen(x.qty*(x.price-x.cost))}</td><td><button class="rowbtn" onclick="del(${x.id})">削除</button></td></tr>`).join("")+'</tbody></table>';
}
function del(id){if(confirm("この記録を削除しますか？")){data=data.filter(x=>x.id!==id);saveData();render()}}
function render(){renderSummary();renderRecords()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["input","summary","records"].forEach(id=>$(id).classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden");render()});
$("printSummary").onclick=()=>{$("monthDetailCard").classList.add("hidden");renderSummary();setTimeout(()=>window.print(),50)};
$("closeDetail").onclick=()=>$("monthDetailCard").classList.add("hidden");$("prevYear").onclick=()=>{sumYear--;renderSummary();$("monthDetailCard").classList.add("hidden")};$("nextYear").onclick=()=>{sumYear++;renderSummary();$("monthDetailCard").classList.add("hidden")};
$("prevRec").onclick=()=>{recYear--;renderRecords()};$("nextRec").onclick=()=>{recYear++;renderRecords()};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
updatePreview();render();
</script>
</body>
</html>
